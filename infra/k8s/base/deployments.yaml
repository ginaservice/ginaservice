apiVersion: apps/v1
kind: Deployment
metadata:
  name: gina-api-gateway
  labels: { app: gina-api-gateway, tier: gateway }
spec:
  replicas: 3
  selector:
    matchLabels: { app: gina-api-gateway }
  template:
    metadata:
      labels: { app: gina-api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/ginaservice/api-gateway:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
