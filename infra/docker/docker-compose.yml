version: '3.9'

# =====================================================
# GinaService — Amazon-Grade Docker Compose Stack
# =====================================================
services:

  # ========== API Gateway ==========
  api-gateway:
    build: { context: ./services/api-gateway, dockerfile: Dockerfile }
    container_name: gina-api-gateway
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      PAY_SERVICE_URL: http://gina-pay:3003
      NOTIF_SERVICE_URL: http://notification-service:3004
      ANALYTICS_URL: http://analytics-service:3005
      CHAMELEON_URL: http://chameleon-core:3006
      REDIS_URL: redis://redis:6379
    depends_on: [redis, postgres]
    networks: [gina-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD","curl","-f","http://localhost:3000/health"], interval: 30s, timeout: 10s, retries: 3 }

  # ========== Auth Service ==========
  auth-service:
    build: { context: ./services/auth-service, dockerfile: Dockerfile }
    container_name: gina-auth-service
    ports: ["3001:3001"]
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gina:${DB_PASSWORD:-gina_dev_pass}@postgres:5432/gina_db
    depends_on: [redis, postgres]
    networks: [gina-net]
    restart: unless-stopped

  # ========== User Service ==========
  user-service:
    build: { context: ./services/user-service, dockerfile: Dockerfile }
    container_name: gina-user-service
    ports: ["3002:3002"]
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://gina:${DB_PASSWORD:-gina_dev_pass}@postgres:5432/gina_db
      REDIS_URL: redis://redis:6379
    depends_on: [redis, postgres]
    networks: [gina-net]
    restart: unless-stopped

  # ========== GinaPay Service ==========
  gina-pay:
    build: { context: ./services/gina-pay, dockerfile: Dockerfile }
    container_name: gina-pay-service
    ports: ["3003:3003"]
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://gina:${DB_PASSWORD:-gina_dev_pass}@postgres:5432/gina_db
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-gina_webhook_secret}
    depends_on: [redis, postgres]
    networks: [gina-net]
    restart: unless-stopped

  # ========== Notification Service ==========
  notification-service:
    build: { context: ./services/notification-service, dockerfile: Dockerfile }
    container_name: gina-notification-service
    ports: ["3004:3004"]
    environment:
      NODE_ENV: development
      PORT: 3004
      REDIS_URL: redis://redis:6379
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-placeholder}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-placeholder}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-placeholder}
    depends_on: [redis]
    networks: [gina-net]
    restart: unless-stopped

  # ========== Chameleon Core ==========
  chameleon-core:
    build: { context: ./services/chameleon-core, dockerfile: Dockerfile }
    container_name: gina-chameleon-core
    ports: ["3006:3006"]
    environment:
      NODE_ENV: development
      PORT: 3006
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-placeholder}
    depends_on: [redis]
    networks: [gina-net]
    restart: unless-stopped

  # ========== Web App ==========
  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    container_name: gina-web-app
    ports: ["3100:3100"]
    environment:
      VITE_API_URL: http://api-gateway:3000
      VITE_ENV: development
    networks: [gina-net]
    restart: unless-stopped

  # ========== PostgreSQL ==========
  postgres:
    image: postgres:16-alpine
    container_name: gina-postgres
    environment:
      POSTGRES_USER: gina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gina_dev_pass}
      POSTGRES_DB: gina_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [gina-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL","pg_isready -U gina -d gina_db"], interval: 10s, retries: 5 }

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: gina-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-gina_redis_pass} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    networks: [gina-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-gina_redis_pass}","ping"], interval: 10s, retries: 5 }

  # ========== Nginx Reverse Proxy ==========
  nginx:
    image: nginx:1.27-alpine
    container_name: gina-nginx
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on: [api-gateway, web]
    networks: [gina-net]
    restart: unless-stopped

  # ========== Prometheus ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: gina-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [gina-net]
    restart: unless-stopped

  # ========== Grafana ==========
  grafana:
    image: grafana/grafana:latest
    container_name: gina-grafana
    ports: ["3200:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-gina_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: monitoring.ginaservice.com
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on: [prometheus]
    networks: [gina-net]
    restart: unless-stopped

  # ========== Jaeger Tracing ==========
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: gina-jaeger
    ports: ["16686:16686", "14268:14268"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [gina-net]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  gina-net:
    driver: bridge
    ipam:
      config: [{ subnet: 172.21.0.0/16 }]
