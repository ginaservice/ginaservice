global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gina-microservices'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'api-gateway:3000'
          - 'auth-service:3001'
          - 'user-service:3002'
          - 'gina-pay:3003'
          - 'notification-service:3004'
          - 'analytics-service:3005'
          - 'chameleon-core:3006'
